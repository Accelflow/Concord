schema_version: 2
definition:
  id: "REL-EXECUTION-CONTEXT"
  contract_id: "C-EXECUTION"
  property_id: "P-RELATION-CONTEXT"
  relation: "requires"
  applicability:
    condition: "このリポジトリの標準Rust回帰テストが、fixtureまたは一時ディレクトリ内で対象CLIの振る舞いを検証する"
  implementations:
    - "src/cargo_runner.rs"
    - "src/planning.rs"
    - "src/model.rs"
    - "src/engine.rs"
    - "src/runner.rs"
  obligations:
    -
      id: "O-EXECUTION-CONTEXT"
      method: "integration"
      tests:
        -
          file: "tests/relations.rs"
