        -
          file: "tests/relations.rs"
          name: "an_unapproved_contract_does_not_taint_another_contract_result"
        -
          file: "tests/rust_cli.rs"
          name: "cargo_scan_plan_verify_explain_and_relation_results"
    -
      id: "O-VERIFY-CASE-IDENTITY"
      method: "e2e"
      tests:
        - file: "tests/cli_e2e.rs"
          name: "failure_matches_full_run_and_timings_are_recorded"
        - file: "tests/cli_e2e.rs"
          name: "unexpected_executed_cases_still_fail_closed"
        - file: "tests/rust_cli.rs"
          name: "cargo_failed_and_ignored_obligations_are_not_success"
        - file: "tests/rust_cli.rs"
          name: "cargo_scan_plan_verify_explain_and_relation_results"
        - file: "tests/cli_e2e.rs"
          name: "oss_demo_selects_search_and_explains_detail_failure"
