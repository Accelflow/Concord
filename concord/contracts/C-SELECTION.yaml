schema_version: 2
definition:
  id: "C-SELECTION"
  description: "変更の影響と検証責務から実行対象を選ぶ"
  version: "6"
  scope: "TS/JS＋Vitestと単一Rustパッケージ＋Cargo/libtestおよび登録コマンドのscan/plan/explain"
  assumptions:
    - "信頼するリポジトリの定義とコードを扱う"
  preconditions:
    - "実行するコマンドが対応する入力形式と実行環境を使う"
    - "対象は対応版の単一Vitestプロジェクト、または単一Cargoパッケージの既定feature・ホスト上の標準libtest、または登録した任意コマンドである"
    - "Rustの追加リポジトリ入力は、作成者が各targetのruntime_inputsとしてレビューし正確に宣言している。未確認なら全実行へ戻す"
    - "適用条件の自然言語はレビュー済みの前提として扱い、CLIが条件成立を自動証明するとは扱わない"
    - "ランナーと依存環境は固定lockfileに沿って準備し、対応版を利用している"
  # コマンドモードの設定存在と設定変更を区別する。
  responsibility: "Rustはコンパイラ依存と確認済み実行時入力からtargetを選び、解析できない変更を全テストへ拡大し、同じContractの全責務と上位Propertyへ推移的に広げ、テストと登録コマンドを選択する。コマンドモードは未変更の設定の存在だけで全実行にせず、共有設定変更と未登録入力では全検証へ戻す"
  approval_status: "approved"
  requirement_ids:
    - "R-LOCAL-DEVELOPMENT"
