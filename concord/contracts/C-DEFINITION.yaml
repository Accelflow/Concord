schema_version: 2
definition:
  id: "C-DEFINITION"
  description: "構造化定義を読取り専用でチェックする"
  version: "2"
  scope: "schema2文書のcheckと、対応する単一/分割/旧形式定義の読込み"
  assumptions:
    - "信頼するリポジトリの定義とコードを扱う"
  preconditions:
    - "実行するコマンドが対応する入力形式と実行環境を使う"
    - "checkは形式・参照を確認し、実装/テストの実在確認や検証実行はscan/plan/verifyで行う"
  responsibility: "単一YAMLまたは分割YAMLの構文・型・参照を確認し、ファイルを変更せず、検証成功や承認と区別する"
  approval_status: "approved"
  requirement_ids:
    - "R-LOCAL-DEVELOPMENT"
