schema_version: 2
definition:
  id: C-WORKFLOW
  description: 間接的に必要な検証と任意コマンドを含めた検証を完了する
  version: "4"
  scope: Contract内の全検証・Property依存の推移的選択とコマンド実行
  assumptions: [登録したコマンドは信頼するリポジトリの作成者がレビューしている]
  preconditions: [必要な実行環境とコマンドを実行前に準備している]
  responsibility: コード参照によらない検証も選択し必要なテストとコマンドの失敗を隠さない。固定期待集合と選択実行・全体実行の比較で選択漏れと失敗の見落としを検査する
  approval_status: approved
  requirement_ids: [R-LOCAL-DEVELOPMENT]
