schema_version = 1
# このリポジトリのRustテストをCargo/libtestで収集・実行する。
non_runtime_paths = ["README.md"]
always_test_files = []

[runner]
kind = "cargo"
program = "cargo"
args = []
version = "1.97.1"
timeout_seconds = 600

# Compiler dep-info covers Rust compilation. These reviewed declarations cover
# additional repository inputs read at runtime by each test target.
# [] means no additional repository files; temporary test projects are outputs.
[rust.runtime_inputs]
"src/lib.rs" = []
"tests/cli_e2e.rs" = ["tests/fixtures/vitest/", "examples/search-detail/"]
"tests/definition_check.rs" = []
"tests/commands.rs" = []
"tests/relations.rs" = ["tests/fixtures/vitest/"]
"tests/rust_cli.rs" = []
"tests/rust_dependencies.rs" = []
# The definition-binding regression reads implementation/test files by YAML refs.
"tests/split_definitions.rs" = ["concord/", "src/", "tests/"]

# Commands supplement Cargo tests; they are selected by Contract/Property obligations.
[[commands]]
id = "repository-format"
program = "cargo"
args = ["fmt", "--check"]
timeout_seconds = 120

[[commands]]
id = "repository-definitions"
program = "cargo"
args = ["run", "--locked", "--quiet", "--", "check", "--json"]
input_patterns = ["concord/"]
timeout_seconds = 120

# Independent expected sets and selective/full success/failure comparisons.
[[commands]]
id = "selection-assurance-guards"
program = "python3"
args = ["scripts/verify-selection-guards.py"]
files = ["scripts/verify-selection-guards.py", "scripts/test_selection_assurance.py", "scripts/selection_assurance.py", "scripts/unittest_report.py"]
timeout_seconds = 120
[commands.report]
required_cases = [
  "test_selection_assurance.SelectionAssurance.test_valid_positive_and_indirect_failure_are_accepted",
  "test_selection_assurance.SelectionAssurance.test_missing_indirect_selection_is_rejected_even_if_both_runs_pass",
  "test_selection_assurance.SelectionAssurance.test_missing_command_execution_is_rejected",
  "test_selection_assurance.SelectionAssurance.test_missing_relation_property_or_contract_is_rejected",
  "test_selection_assurance.SelectionAssurance.test_unrelated_selection_is_rejected",
  "test_selection_assurance.SelectionAssurance.test_missing_obligation_result_is_rejected",
  "test_selection_assurance.SelectionAssurance.test_missing_property_result_is_rejected",
  "test_selection_assurance.SelectionAssurance.test_masked_failure_is_rejected_even_when_both_reports_claim_success",
  "test_selection_assurance.SelectionAssurance.test_nonzero_command_exit_or_cli_success_mismatch_is_rejected",
  "test_selection_assurance.SelectionAssurance.test_incomplete_or_changed_input_is_rejected",
  "test_selection_assurance.SelectionAssurance.test_unrelated_failure_does_not_require_unrelated_selection",
]

[[commands]]
id = "selection-assurance"
program = "python3"
args = ["scripts/verify-selection.py"]
files = ["scripts/verify-selection.py", "scripts/selection_assurance.py"]
timeout_seconds = 120


[[commands]]
id = "conflux-evidence-guards"
program = "python3"
args = ["scripts/verify-conflux-evidence-guards.py"]
files = ["scripts/verify-conflux-evidence-guards.py", "scripts/test_conflux_link.py", "scripts/conflux_link.py", "scripts/unittest_report.py"]
timeout_seconds = 120
[commands.report]
required_cases = [
  "test_conflux_link.ConfluxLink.test_links_fixed_source_obligation_and_original_report",
  "test_conflux_link.ConfluxLink.test_rejects_a_different_source_or_plan",
  "test_conflux_link.ConfluxLink.test_rejects_duplicate_relation_evidence",
  "test_conflux_link.ConfluxLink.test_rejects_missing_or_skipped_native_cases_despite_passed_count",
  "test_conflux_link.ConfluxLink.test_rejects_tampered_command_report",
  "test_conflux_link.ConfluxLink.test_rejects_wrong_property_or_missing_command_for_an_obligation",
]
